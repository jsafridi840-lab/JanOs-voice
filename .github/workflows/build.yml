name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk JanOS-Voice.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JanOS-Voice
          path: JanOS-Voice.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: JanOS Voice v1.0.${{ github.run_number }}
          make_latest: true
          files: JanOS-Voice.apk
